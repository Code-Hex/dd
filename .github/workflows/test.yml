
name: test
on:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.16.x', '1.17.x', '1.18.x', '1.19.x', '1.20.x', '1.21.x', '1.22.x', '1.23.x', '1.24.x', '1.25.x', '1.26.x', '1.27.x']
    name: Test on Go ${{ matrix.go }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - name: Test Coverage (pkg)
      run: go test ./... -race -coverprofile=${{ runner.temp }}/coverage.txt
    - name: Upload coverage
      if: ${{ matrix.go == '1.27.x' }}
      uses: codecov/codecov-action@v2
      with:
        files: ${{ runner.temp }}/coverage.txt
